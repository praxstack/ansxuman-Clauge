<svg xmlns="http://www.w3.org/2000/svg" width="100%" role="img" viewBox="0 0 680 480"><title>Animated pixel creature aligned legs</title><desc>A pixel art orange creature with 4 properly aligned legs</desc><defs><style>@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes leg1{0%{transform:translateY(0)}25%{transform:translateY(-12px)}75%{transform:translateY(6px)}}@keyframes leg2{0%{transform:translateY(6px)}25%{transform:translateY(0)}75%{transform:translateY(-12px)}}@keyframes leg3{0%{transform:translateY(-6px)}25%{transform:translateY(6px)}75%{transform:translateY(0)}}@keyframes leg4{0%{transform:translateY(6px)}25%{transform:translateY(-12px)}75%{transform:translateY(0)}}@keyframes armL{0%{transform:translateY(0)}50%{transform:translateY(10px)}}@keyframes armR{0%{transform:translateY(10px)}50%{transform:translateY(0)}}@keyframes blink{0%,88%{transform:scaleY(1)}93%{transform:scaleY(.08)}}.body-bob{animation:bob .42s ease-in-out infinite}.arm-l,.arm-r,.eye{transform-box:fill-box}.l1{animation:leg1 .42s ease-in-out infinite}.l1,.l2,.l3,.l4{transform-box:fill-box;transform-origin:50% 0}.l2{animation:leg2 .42s ease-in-out infinite}.l3{animation:leg3 .42s ease-in-out infinite}.l4{animation:leg4 .42s ease-in-out infinite}.arm-l{animation:armL .42s ease-in-out infinite}.arm-l,.arm-r,.eye{transform-origin:50% 50%}.arm-r{animation:armR .42s ease-in-out infinite}.eye{animation:blink 3s ease-in-out infinite}</style></defs><g class="l1"><rect width="36" height="64" x="251" y="320" fill="#CC785C"/></g><g class="l2"><rect width="36" height="64" x="298" y="320" fill="#CC785C"/></g><g class="l3"><rect width="36" height="64" x="345" y="320" fill="#CC785C"/></g><g class="l4"><rect width="36" height="64" x="392" y="320" fill="#CC785C"/></g><g class="body-bob"><g class="arm-l"><rect width="48" height="48" x="192" y="190" fill="#CC785C"/></g><g class="arm-r"><rect width="48" height="48" x="440" y="190" fill="#CC785C"/></g><rect width="200" height="160" x="240" y="160" fill="#CC785C"/><g class="eye"><rect width="36" height="36" x="272" y="188" fill="#1a1a1a"/></g><g class="eye"><rect width="36" height="36" x="372" y="188" fill="#1a1a1a"/></g></g></svg>